services: 
  reverse-proxy:
    image: traefik:v3.1
    command:
      - "--api.insecure=true"
      - "--providers.docker"
      - "--providers.docker.exposedbydefault=false"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=cert@nhld.net"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      
    ports:
      -"443:443"
      -"8080:8080"
    volumes:
      - letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock
  sveltekit-docker:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.personalwebsite.rule=Host(`nhld.net`)"
      - "traefik.http.routers.personalwebsite.entrypoints=websecure"
      - "traefik.http.routers.personalwebsite.tls.certresolver=myresolver"
    build:
      context: .
      dockerfile: Dockerfile
volumes: 
  letsencrypt:
